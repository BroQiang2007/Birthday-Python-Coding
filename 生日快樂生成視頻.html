 function checkZuoPinOk(){
	//加载tpl,判断所有比改项是否修改
	for(var j=0;j<bztpl.elements.length;j++){

async function checkMemberNum(order_id){
	return new Promise(function (resolve, reject) {
		http_post({url:getProtocol()+'//www.xiexinbao.com/txb/order/num/get',data: {id:order_id},callback:function(res){
			var result = JSON.parse(res);
			resolve(result);
		}});
	});
}

	http_post({url:getProtocol()+'//www.xiexinbao.com/txb/kouling/item',data:{kouling:window.location.hostname},callback:function(html){
		try{

		}
	}});
}
setTimeout(function(){loadKouling();},100);

var bztpl = {};
function loadTpl(){
	return new Promise(function (resolve, reject) {
		if(order_id) {
			http_post({url:getProtocol()+'//www.xiexinbao.com/txb/order/item?id='+order_id,callback:function(html){
				var result = JSON.parse(html);
				if(result.id!=0) {
					var _bztpl =  JSON.parse(JSON.parse(html).data_in);
					_bztpl.price = result.price;
					for(var i=0;i<_bztpl.elements.length;i++){
						delete _bztpl.elements[i]['image'];
						if(!_bztpl.elements[i].hasOwnProperty('init_value') && _bztpl.elements[i].mustChange=='ok'){
							_bztpl.elements[i]['init_value'] = _bztpl.elements[i]['value'];
						}
					}
					resolve(_bztpl);
				} else {
					http_post({url:getProtocol()+'//www.xiexinbao.com/txb/tpl/item?id='+tpl_id,callback:async function(html){
						var _bztpl = JSON.parse(html);
						for(var i=0;i<_bztpl.elements.length;i++){
							delete _bztpl.elements[i]['image'];
							if(!_bztpl.elements[i].hasOwnProperty('init_value') && _bztpl.elements[i].mustChange=='ok'){
							_bztpl.elements[i]['init_value'] = _bztpl.elements[i]['value'];
						}
						}
						resolve(_bztpl);
					}});
				}
			}});
		} else {
			http_post({url:getProtocol()+'//www.xiexinbao.com/txb/tpl/item?id='+tpl_id,callback:async function(html){
				var _bztpl = JSON.parse(html);
				for(var i=0;i<_bztpl.elements.length;i++){
					delete _bztpl.elements[i]['image'];
					if(!_bztpl.elements[i].hasOwnProperty('init_value') && _bztpl.elements[i].mustChange=='ok'){
						_bztpl.elements[i]['init_value'] = _bztpl.elements[i]['value'];
					}
				}
				resolve(_bztpl);
			}});
		}
	});
}

async function  main(){
	bztpl = await loadTpl();
	//bztpl.tips = bztpl.tips.replaceAll('\n','<br>');
	bztpl.getItem = function(id){
		for(var i=0;i<bztpl.elements.length;i++){
			var element = bztpl.elements[i];
			if(element.id==id){
				return element;
			}
		}
	};
	
	bztpl.elements.sort((a, b) => {//排序
		a['z-index']= parseInt(a['z-index']);
		b['z-index']=parseInt(b['z-index']);
		return parseInt(a['z-index']) > parseInt(b['z-index']) ? 1 : -1;
	});


	for(var i=0;i<bztpl.elements.length;i++){
		var element = bztpl.elements[i];
		
		if(element.type=='img'){
			element.bindFn = popImgUpload;
		}
		if(element.type=='text'){
			element.bindFn = popEditText;
		}
	}
	
	document.title = bztpl.title;
	//document.querySelector('#tips').innerHTML = bztpl.tips;
	renderVideo(bztpl);
	//渲染box
	render.show(bztpl);
};

function renderVideo(bztpl){
	var videoDiv = document.createElement('div');
	var html = document.getElementById("tpl-video").innerHTML;
	html = html.replaceAll('{poster}',bztpl.poster);
	html = html.replaceAll('{mp4_url}',bztpl.mp4_url);
	document.getElementById('video-box').appendChild(videoDiv);
	videoDiv.outerHTML = html;
}
